name: bookshelf
description: Bookshelf app for the Porcupine Flutter assessment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  http: ^1.0.0
  sqflite: ^2.3.3
  path: ^1.2.5
  shared_preferences: ^2.2.1
  flutter_riverpod: ^2.4.10
  connectivity_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.5.0

flutter:
  uses-material-design: true
